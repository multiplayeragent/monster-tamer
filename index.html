<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monster Tamer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #2f6b3a; }
  body { font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }

          border-radius: 999px; background: #0009; font-weight: 700; font-size: 14px; text-align: center; pointer-events: none; transition: opacity .5s; }
  #toast { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); max-width: calc(100vw - 32px); box-sizing: border-box; padding: 9px 18px; border-radius: 14px; background: #000b;
           font-weight: 800; text-align: center; pointer-events: none; transition: opacity .3s; opacity: 0; }
  #fight { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 92px); min-width: 140px; min-height: 52px; padding: 0 18px;
           border: 0; border-radius: 16px; background: #ffd166; color: #3a2600; font: 900 16px system-ui, sans-serif; box-shadow: 0 4px 0 #b8861b, 0 6px 16px #0006; cursor: pointer; }
  #fight:disabled { background: #ffffff33; color: #ffffffaa; box-shadow: none; }

  #net { position: fixed; bottom: max(4px, env(safe-area-inset-bottom)); left: 10px; font-size: 11px; opacity: .8; pointer-events: none; white-space: nowrap; text-shadow: 0 1px 2px #000; }
  #bpanel { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(12px, env(safe-area-inset-right)) calc(max(10px, env(safe-area-inset-bottom)) + 14px) max(12px, env(safe-area-inset-left));
            background: linear-gradient(#1c2238f2, #11152af8); border-top: 3px solid #ffffff22; }
  #log { min-height: 42px; max-width: 760px; margin: 0 auto 8px; font: 800 17px/1.25 system-ui, sans-serif; text-shadow: 0 1px 2px #000; }
  #moves { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 760px; margin: 0 auto; }
  @media (max-width: 560px) { #moves { grid-template-columns: 1fr 1fr; } }
  #moves button { min-height: 52px; border: 0; border-radius: 12px; background: var(--t, #59607a); color: #fff; font: 800 15px system-ui, sans-serif; cursor: pointer; text-shadow: 0 1px 2px #0008;
                  box-shadow: inset 0 -4px 0 #0004; text-align: left; padding: 6px 12px; }
  #moves button small { display: block; font-size: 11px; font-weight: 700; opacity: .9; }
  #moves button.wait { grid-column: 1 / -1; background: #ffffff18; text-align: center; box-shadow: none; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0008; z-index: 5; }
  .box { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 18px; background: #1c2238; border: 1px solid #ffffff22; text-align: center; }
  .box h2 { margin: 0 0 4px; font-size: 26px; } .box p { margin: 0 0 12px; opacity: .9; }
  .box h3 { margin: 6px 0 4px; font-size: 13px; color: #ffd166; text-align: left; }
  .box ol { text-align: left; margin: 0 0 12px; padding-left: 24px; font-size: 14px; min-height: 30px; } .box li span { float: right; }

</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">Walk into a critter in the tall grass to catch it</div>
<div id="toast"></div>
<button id="fight" hidden>Battle</button>
<div id="bpanel" hidden><div id="log"></div><div id="moves"></div></div>
<div id="net">Connecting…</div>
<div id="over" hidden><div class="box">
  <h2 id="overTitle"></h2><p id="overSub"></p>
  <h3>Most battles won</h3><ol id="board"><li>Loading…</li></ol>
  <button id="back">Back to the field</button>
</div></div>
<script>
/* ═══ MONSTER TAMER · a Multiplayer Agent starter ═════════════════════════════════════════
 * Catch critters in the tall grass, then battle another tamer. Versus, 2 players; a bot tamer
 * battles you when you're alone. Your team is saved.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ field size, walking, wild critters, catching, battles, the types and the moves
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   FIELD ......... the map (built from a seed: grass, tall grass, trees, a pond, paths), walls
 *   CRITTERS ...... every critter is a number: its look, name, type, stats and moves come from it
 *   SAVES ......... your team, kept in your player save (this browser too)
 *   WORLD (HOST) .. wild critters, the bot tamer, catches, and running battles turn by turn.
 *                   Only the host runs this and writes the shared fields.
 *   ME ............ walking, bumping into critters, the catching game, challenging
 *   BATTLE VIEW ... plays each turn line by line, the battle scene, move buttons, results
 *   DRAW .......... the field, tamers, wild critters, my team bar, the catching overlay
 *   HUD & INPUT ... hint, battle button, keys, thumb stick and tap-to-walk
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `n`, `c`, `hb`, `p` (position, facing, walking: one JSON
 *     field about 10 times a second) and `team` (the first three critters, for battles).
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s). It
 *     writes `wild` (the wild critters and who is catching which), `rival` (the bot tamer) and
 *     `battle` (one JSON field: id, v, phase pick/over/done, both sides, both teams with health,
 *     who is out front, the turn number, what happened last turn, the winner).
 *   - Intents to the host: "grab" {i} (I bumped into a critter), "caught" {i, ok}, "challenge"
 *     {to} and "move" {b, t, m} (my pick this turn; re-sent until the turn resolves, so a new host
 *     gets it too). The host resolves a turn when both have picked, or when time runs out.
 *   - Every client plays the last turn's lines one by one from `battle.log`, so both players see
 *     the same moves, hits and faints. A new host carries on from the same battle field.
 *   - Your team is YOUR save (player.data, namespace CONFIG.saveNs; this browser when offline):
 *     catches and levels stay with you between visits.
 *   - ?attract plays offline: catch one, then battle the bot tamer (the preview video).
 *   - Leaderboard "wins": +1 for each battle a player wins, shown after every battle.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  tile: 32,            // pixels per field tile
  fieldW: 30,          // field size in tiles
  fieldH: 20,
  fieldSeed: 7,        // the field layout (the same for everyone; change it for a new field)
  speed: 130,          // walking speed, pixels a second
  wildCount: 7,        // wild critters in the tall grass
  wildLevel: [2, 5],   // their level range (a little higher when your team is strong)
  wildSpeed: 26,       // how fast wild critters wander
  respawnMs: 4000,     // a new wild critter shows up this long after one is caught or runs
  holdMs: 15000,       // you have this long to catch a critter you bumped into
  catchTries: 3,       // throws before it runs away
  shakeMs: 420,        // each wobble of the orb
  caughtMs: 1400,      // "Caught!" shows this long
  teamMax: 6,          // critters you can keep
  battleSize: 3,       // critters each side brings to a battle: the first three in your team
  turnMs: 25000,       // time to pick a move before one is picked for you
  stepMs: 1050,        // each line of a turn ("Flumbo used Flare!") shows this long
  resultMs: 6000,      // the battle result shows this long
  seatGraceMs: 8000,   // a tamer silent this long loses the battle
  rival: "Rook",       // the bot tamer who battles you when you're alone
  saveNs: "monster-tamer", // player save namespace: your team
  board: "wins",       // leaderboard name
  // The types: a move of type X does double damage to the types it beats, half to the ones in `weak`.
  types: {
    ember: { name: "Ember", hue: 18,  beats: ["leaf"],  weak: ["tide", "ember"] },
    tide:  { name: "Tide",  hue: 205, beats: ["ember"], weak: ["leaf", "tide"] },
    leaf:  { name: "Leaf",  hue: 118, beats: ["tide"],  weak: ["ember", "leaf"] },
    volt:  { name: "Volt",  hue: 48,  beats: ["tide"],  weak: ["leaf", "volt"] },
  },
  // The moves. power = damage strength, acc = % chance to hit, heal = share of health back, buff = next hits +50%.
  moves: {
    tackle:  { name: "Tackle",  type: null,    power: 40, acc: 100 },
    flare:   { name: "Flare",   type: "ember", power: 55, acc: 95 },
    inferno: { name: "Inferno", type: "ember", power: 90, acc: 70 },
    bubble:  { name: "Bubble",  type: "tide",  power: 55, acc: 95 },
    surge:   { name: "Surge",   type: "tide",  power: 90, acc: 70 },
    vine:    { name: "Vine",    type: "leaf",  power: 55, acc: 95 },
    bloom:   { name: "Bloom",   type: "leaf",  power: 90, acc: 70 },
    zap:     { name: "Zap",     type: "volt",  power: 55, acc: 95 },
    thunder: { name: "Thunder", type: "volt",  power: 90, acc: 70 },
    focus:   { name: "Focus",   type: null,    buff: 1,   acc: 100 },
    rest:    { name: "Rest",    type: null,    heal: 0.4, acc: 100 },
  },
  typeMoves: { ember: ["flare", "inferno"], tide: ["bubble", "surge"], leaf: ["vine", "bloom"], volt: ["zap", "thunder"] },
};
const COLORS = ["#ff5a5f", "#4f8cff", "#3ecf7a", "#ffc23d", "#ff8a3d", "#2fd4d4", "#ff6fb5", "#e8e8f0"];
const RIVAL_COLOR = "#8a5cf6";
const NAME_A = ["Brave", "Sunny", "Lucky", "Swift", "Quiet", "Wild"], NAME_B = ["Tamer", "Ranger", "Scout", "Keeper", "Trainer", "Rover"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'monster-tamer',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fallback);
  memo.set(key, { raw, v });
  return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── FIELD ───────────────────────────────────────────────────────────────────────────
// Tiles: "." grass, "," tall grass (critters live here), "T" tree, "~" water, "=" path, "*" flowers.
const T = CONFIG.tile, FW = CONFIG.fieldW, FH = CONFIG.fieldH;
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function makeField() {
  const r = mulberry32(CONFIG.fieldSeed), g = Array.from({ length: FH }, () => Array(FW).fill(".")), cx = FW >> 1, cy = FH >> 1;
  const blob = (bx, by, rx, ry, c) => { for (let y = 1; y < FH - 1; y++) for (let x = 1; x < FW - 1; x++) if (((x - bx) / rx) ** 2 + ((y - by) / ry) ** 2 < 1 - r() * 0.3) g[y][x] = c; };
  blob(cx - 6, cy - 3, 3.4, 2.4, ","); // a patch right next to the start
  for (let k = 0; k < 5; k++) blob(4 + r() * (FW - 8), 3 + r() * (FH - 6), 2.2 + r() * 2.4, 1.6 + r() * 1.6, ",");
  blob(Math.round(FW * 0.78), Math.round(FH * 0.3), 3.2, 2.3, "~");
  for (let x = 1; x < FW - 1; x++) if (g[cy][x] !== "~") g[cy][x] = "=";
  for (let y = 1; y < FH - 1; y++) if (g[y][cx] !== "~") g[y][cx] = "=";
  for (let k = 0; k < 26; k++) { const x = 1 + Math.floor(r() * (FW - 2)), y = 1 + Math.floor(r() * (FH - 2)); if (g[y][x] === "." && Math.abs(x - cx) + Math.abs(y - cy) > 4) g[y][x] = "T"; }
  for (let k = 0; k < 34; k++) { const x = 1 + Math.floor(r() * (FW - 2)), y = 1 + Math.floor(r() * (FH - 2)); if (g[y][x] === ".") g[y][x] = "*"; }
  for (let x = 0; x < FW; x++) g[0][x] = g[FH - 1][x] = "T";
  for (let y = 0; y < FH; y++) g[y][0] = g[y][FW - 1] = "T";
  return g;
}
const FIELD = makeField();
const tileAt = (x, y) => FIELD[Math.floor(y / T)]?.[Math.floor(x / T)] ?? "T";
const solid = (x, y) => { const c = tileAt(x, y); return c === "T" || c === "~"; };
const blocked = (x, y, r) => solid(x - r, y - r) || solid(x + r, y - r) || solid(x - r, y + r) || solid(x + r, y + r);
/** Move a body, sliding along walls. */
function moveBody(e, dx, dy, r = 9) { const stuck = blocked(e.x, e.y, r); if (stuck || !blocked(e.x + dx, e.y, r)) e.x += dx; if (stuck || !blocked(e.x, e.y + dy, r)) e.y += dy; }
const SPAWN = { x: ((FW >> 1) + 0.5) * T, y: ((FH >> 1) + 0.5) * T };
const GRASS = []; FIELD.forEach((row, y) => row.forEach((c, x) => { if (c === ",") GRASS.push([x, y]); }));
const WALKABLE = []; FIELD.forEach((row, y) => row.forEach((c, x) => { if (c !== "T" && c !== "~") WALKABLE.push([x, y]); }));

// ── CRITTERS ────────────────────────────────────────────────────────────────────────
// A critter is { s: seed, lv: level, xp }. Everything else (type, name, look, stats, moves) comes from the seed.
const TYPE_KEYS = Object.keys(CONFIG.types);
const SYL = { ember: ["Pyr", "Cind", "Blaz", "Emb", "Scor", "Fla"], tide: ["Aqu", "Drip", "Flo", "Wav", "Bub", "Spla"], leaf: ["Spro", "Fern", "Moss", "Bud", "Thi", "Pet"], volt: ["Zap", "Volt", "Spar", "Fizz", "Jol", "Buzz"] };
const ENDS = ["y", "o", "let", "bit", "kin", "ling", "ox", "ee", "ix", "umo", "ip", "a"];
const speciesCache = new Map();
function species(seed) {
  let sp = speciesCache.get(seed);
  if (sp) return sp;
  const r = mulberry32(seed * 7919 + 17), pick = (a) => a[Math.floor(r() * a.length)];
  const type = TYPE_KEYS[Math.floor(r() * TYPE_KEYS.length)], hue = CONFIG.types[type].hue + (r() - 0.5) * 34, sat = 62 + r() * 22, light = 56 + r() * 10;
  sp = {
    seed, type, name: pick(SYL[type]) + pick(ENDS),
    color: `hsl(${hue},${sat}%,${light}%)`, dark: `hsl(${hue},${sat}%,${light - 26}%)`, belly: `hsl(${hue + 25},${sat - 25}%,${Math.min(92, light + 24)}%)`,
    w: 0.85 + r() * 0.3, h: 0.78 + r() * 0.3, bumps: Array.from({ length: 10 }, () => 0.9 + r() * 0.18),
    ears: Math.floor(r() * 5), eyes: r() < 0.12 ? 1 : r() < 0.12 ? 3 : 2, eye: 0.12 + r() * 0.07, mouth: Math.floor(r() * 3), tail: Math.floor(r() * 3), feet: r() < 0.8,
    spots: r() < 0.5 ? Array.from({ length: 2 + Math.floor(r() * 3) }, () => [r() * 1.1 - 0.75, r() * 0.7 - 0.45, 0.07 + r() * 0.07]) : [],
    base: { hp: 40 + Math.floor(r() * 18), atk: 10 + Math.floor(r() * 8), def: 10 + Math.floor(r() * 8), spd: 6 + Math.floor(r() * 14) },
  };
  sp.moves = ["tackle", CONFIG.typeMoves[type][0], pick([CONFIG.typeMoves[type][1], "focus", "rest"])];
  speciesCache.set(seed, sp);
  return sp;
}
const grow = (base, lv) => Math.round(base * (0.6 + lv * 0.08));
function stats(c) { const b = species(c.s).base; return { hp: grow(b.hp, c.lv) + 5, atk: grow(b.atk, c.lv), def: grow(b.def, c.lv), spd: grow(b.spd, c.lv) }; }
const xpNeed = (lv) => 8 + lv * 4;
const typeColor = (t, l = 52) => (t ? `hsl(${CONFIG.types[t].hue},80%,${l}%)` : "#7d8399");
function typeMult(moveType, defType) { if (!moveType) return 1; const X = CONFIG.types[moveType]; return X.beats.includes(defType) ? 2 : X.weak.includes(defType) ? 0.5 : 1; }
/** A random critter seed (of a given type, if asked). */
function newSeed(type) { for (let k = 0; k < 400; k++) { const s = 1 + Math.floor(Math.random() * 99999999); if (!type || species(s).type === type) return s; } return 1; }
/** Draw a critter at (x, y), size R, facing right (face 1) or left (-1). */
function drawCritter(c2, sp, x, y, R, o = {}) {
  const t = o.t || 0, bob = Math.sin(t * 4 + sp.seed) * R * 0.05, w = R * sp.w, h = R * sp.h;
  c2.save(); c2.translate(x, y); c2.globalAlpha = o.alpha ?? 1;
  c2.fillStyle = "#0004"; c2.beginPath(); c2.ellipse(0, h * 0.62, w * 0.7, R * 0.16, 0, 0, Math.PI * 2); c2.fill();
  c2.translate(0, bob - (o.lift || 0)); c2.scale((o.face || 1) * (o.scale || 1), o.scale || 1);
  const col = o.flash ? "#ffffff" : sp.color, dark = o.flash ? "#ffffff" : sp.dark, lw = Math.max(1, R * 0.05);
  c2.lineWidth = lw; c2.lineCap = "round"; c2.lineJoin = "round";
  // tail, behind the body
  if (sp.tail === 1) { c2.strokeStyle = dark; c2.lineWidth = R * 0.14; c2.beginPath(); c2.moveTo(-w * 0.5, h * 0.1); c2.quadraticCurveTo(-w * 1.0, h * 0.05, -w * 0.85, -h * 0.35); c2.stroke(); c2.lineWidth = lw; }
  if (sp.tail === 2) { c2.fillStyle = dark; c2.beginPath(); c2.arc(-w * 0.62, h * 0.12, R * 0.14, 0, Math.PI * 2); c2.fill(); }
  if (sp.type === "volt") { c2.strokeStyle = "#ffe14d"; c2.lineWidth = R * 0.1; c2.beginPath(); c2.moveTo(-w * 0.5, 0); c2.lineTo(-w * 0.8, -h * 0.2); c2.lineTo(-w * 0.65, -h * 0.28); c2.lineTo(-w * 0.95, -h * 0.55); c2.stroke(); c2.lineWidth = lw; }
  if (sp.feet) { c2.fillStyle = dark; for (const s of [-1, 1]) { c2.beginPath(); c2.ellipse(s * w * 0.32, h * 0.5, w * 0.17, h * 0.12, 0, 0, Math.PI * 2); c2.fill(); } }

  const pts = sp.bumps.map((b, i) => { const a = (i / sp.bumps.length) * Math.PI * 2; return [Math.cos(a) * w * 0.62 * b, Math.sin(a) * h * 0.55 * b]; });
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  c2.fillStyle = col; c2.strokeStyle = dark; c2.beginPath();
  let m0 = mid(pts[pts.length - 1], pts[0]); c2.moveTo(m0[0], m0[1]);
  pts.forEach((p, i) => { const m = mid(p, pts[(i + 1) % pts.length]); c2.quadraticCurveTo(p[0], p[1], m[0], m[1]); });
  c2.fill(); c2.stroke();
  c2.fillStyle = o.flash ? "#fff" : sp.belly; c2.beginPath(); c2.ellipse(w * 0.14, h * 0.2, w * 0.3, h * 0.24, 0, 0, Math.PI * 2); c2.fill();

  c2.globalAlpha = o.alpha ?? 1;

  }));

    const X = x * T + T / 2, Y = y * T + T / 2;
    c.fillStyle = "#0003"; c.beginPath(); c.ellipse(X + 3, Y + 11, 14, 6, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#7a5230"; c.fillRect(X - 3, Y, 6, 12);
    c.fillStyle = "#2f8a46"; c.beginPath(); c.arc(X, Y - 4, 15, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#3fa65a"; c.beginPath(); c.arc(X - 4, Y - 8, 9, 0, Math.PI * 2); c.fill();

}
const cam = { x: SPAWN.x, y: SPAWN.y, z: 1 };
/** The camera follows me and stops at the field's edges. Screen ↔ world always goes through it. */
function placeCamera() {

}
const toWorld = (X, Y) => ({ x: cam.x + (X - W / 2) / cam.z, y: cam.y + (Y - H / 2) / cam.z });
const views = new Map(); // eased positions of everything I don't move myself
function eased(id, x, y, dt) { let v = views.get(id); if (!v) { v = { x, y }; views.set(id, v); } const k = 1 - Math.pow(0.0006, dt); v.x += (x - v.x) * k; v.y += (y - v.y) * k; return v; }
function drawTamer(x, y, color, name, f, moving, t, mine, badge) {
  const step = moving ? Math.sin(t * 14) * 3 : 0;
  ctx.fillStyle = "#0004"; ctx.beginPath(); ctx.ellipse(x, y + 12, 9, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#33384d"; ctx.fillRect(x - 5, y + 3 + Math.max(0, step) * 0.5, 4, 9 - Math.max(0, step)); ctx.fillRect(x + 1, y + 3 + Math.max(0, -step) * 0.5, 4, 9 - Math.max(0, -step));
  ctx.fillStyle = color; rr(x - 7, y - 6, 14, 12, 4); ctx.fill();
  ctx.fillStyle = "#ffd7b3"; ctx.beginPath(); ctx.arc(x, y - 11, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y - 13, 7.3, Math.PI, 0); ctx.fill(); ctx.fillRect(x + (f > 0 ? 0 : -10), y - 14, 10, 3);
  ctx.fillStyle = "#1a1726"; ctx.fillRect(x + f * 3 - 1, y - 11, 2, 2.5);
  ctx.font = "800 9px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.lineWidth = 3; ctx.strokeStyle = "#0009"; ctx.strokeText(name, x, y - 23); ctx.fillStyle = mine ? "#ffe08a" : "#fff"; ctx.fillText(name, x, y - 23);
  if (badge) { ctx.fillStyle = "#fff"; rr(x - ctx.measureText(badge).width / 2 - 6, y - 46, ctx.measureText(badge).width + 12, 15, 7); ctx.fill(); ctx.fillStyle = "#1a1726"; ctx.fillText(badge, x, y - 35); }
}
function drawField(now, dt) {
  placeCamera();
  const t = now / 1000;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#2f6b3a"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(DPR * cam.z, 0, 0, DPR * cam.z, DPR * (W / 2 - cam.x * cam.z), DPR * (H / 2 - cam.y * cam.z));
  ctx.drawImage(fieldCv, 0, 0, FW * T, FH * T);
  // water shimmer
  ctx.strokeStyle = "#ffffff55"; ctx.lineWidth = 1.5;
  FIELD.forEach((row, y) => row.forEach((ch, x) => { if (ch === "~" && (x + y) % 3 === 0) { const o = Math.sin(t * 2 + x) * 4; ctx.beginPath(); ctx.moveTo(x * T + 8 + o, y * T + 14); ctx.lineTo(x * T + 18 + o, y * T + 14); ctx.stroke(); } }));
  const things = [];
  for (const w of wildList()) { const v = isHost() ? w : eased("w" + w.i, w.x, w.y, dt); things.push({ y: v.y, draw: () => drawWild(w, v, t) }); }
  const b = battle(), r = rivalNow();
  if (r && r.on) { const v = isHost() ? r : eased("rival", r.x, r.y, dt); things.push({ y: v.y, draw: () => drawTamer(v.x, v.y, RIVAL_COLOR, CONFIG.rival, r.f, r.m, t, false, inBattle("bot") ? "⚔" : r.say) }); }
  for (const id of livePlayers()) {
    if (id === net.sessionId) continue;
    const p = posOf(id); if (!p) continue;
    const v = eased(id, p.x, p.y, dt), pl = S.entities.players[id];
    things.push({ y: v.y, draw: () => drawTamer(v.x, v.y, pl.c || COLORS[1], pl.n || "Tamer", p.f || 1, p.m, t, false, inBattle(id) ? "⚔" : holding(id) ? "Catching…" : "") });
  }
  things.push({ y: me.y, draw: () => drawTamer(me.x, me.y, myColor, myName, me.f, me.m, t, true, "") });
  things.sort((p, q) => p.y - q.y).forEach((x) => x.draw());
  if (me.goal) { ctx.strokeStyle = "#fff8"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(me.goal.x, me.goal.y, 6 + Math.sin(t * 8) * 2, 0, Math.PI * 2); ctx.stroke(); }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawTeamBar(now);
  drawStick();
}
function drawWild(w, v, t) {
  const sp = species(w.s), inGrass = tileAt(v.x, v.y) === ",", R = 12 + Math.min(4, w.lv * 0.4);
  if (w.h) { ctx.strokeStyle = "#ffffffaa"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(v.x, v.y, R * 1.6 + Math.sin(t * 6) * 2, 0, Math.PI * 2); ctx.stroke(); }
  drawCritter(ctx, sp, v.x, v.y - 2, R, { t, face: w.f || 1 });
  if (inGrass) { // grass blades in front of its feet
    ctx.strokeStyle = "#2e7f3a"; ctx.lineWidth = 2;
    for (let k = -2; k <= 2; k++) { const bx = v.x + k * 5; ctx.beginPath(); ctx.moveTo(bx - 3, v.y + 2); ctx.lineTo(bx, v.y + R * 0.7); ctx.lineTo(bx + 3, v.y + 2); ctx.stroke(); }
  }
  ctx.font = "800 8px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.lineWidth = 3; ctx.strokeStyle = "#0008";
  ctx.strokeText(`Lv ${w.lv}`, v.x, v.y - R - 6); ctx.fillText(`Lv ${w.lv}`, v.x, v.y - R - 6);
}
// My team along the bottom: the first three (gold ring) battle. Tap one to bring it to the front.
let teamSlots = [];
function drawTeamBar(now) {
  if (ATTRACT) return;
  const n = save.team.length, size = Math.min(54, (W - 24) / 6 - 6), y = H - size - 22 - (document.getElementById("safe")?.offsetHeight || 0);
  teamSlots = save.team.map((c, i) => ({ x: 12 + i * (size + 6), y, w: size, h: size, i }));
  for (const s of teamSlots) {
    const c = save.team[s.i], sp = species(c.s);
    ctx.fillStyle = "#1c2238cc"; rr(s.x, s.y, s.w, s.h, 12); ctx.fill();
    if (s.i < CONFIG.battleSize) { ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 2; ctx.stroke(); }
    drawCritter(ctx, sp, s.x + s.w / 2, s.y + s.h * 0.48, s.w * 0.3, { t: now / 1000 });
    ctx.font = "800 10px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.fillText(`Lv ${c.lv}`, s.x + s.w / 2, s.y + s.h - 4);
    ctx.fillStyle = typeColor(sp.type, 55); ctx.beginPath(); ctx.arc(s.x + 8, s.y + 8, 4, 0, Math.PI * 2); ctx.fill();
  }
  if (!n) { ctx.font = "700 13px system-ui, sans-serif"; ctx.textAlign = "left"; ctx.fillStyle = "#fff"; ctx.fillText("Your team is empty", 14, y + 30); }
}
/** The catching game, over the field. */
function drawCatch(now) {
  const c = catching, sp = species(c.w.s), cx = W / 2, cy = H * 0.45, R = Math.min(W, H) * 0.13;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#0b1a10cc"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#3f9b4a"; ctx.beginPath(); ctx.ellipse(cx, cy + R * 0.8, R * 2, R * 0.55, 0, 0, Math.PI * 2); ctx.fill();
  const inOrb = c.phase === "shake" || (c.phase === "done") || (c.phase === "throw" && now - c.at > 380);
  if (!inOrb) drawCritter(ctx, sp, cx, cy, R, { t: now / 1000, face: -1, alpha: c.phase === "fled" ? Math.max(0, 1 - (now - c.at) / 600) : 1 });
  if (c.phase === "aim") {
    const r = ringAt(c, now), target = R * 1.25, ring = target * (r / 0.3), good = Math.abs(r - 0.3) < 0.07;
    ctx.setLineDash([8, 6]); ctx.strokeStyle = "#4ade80"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, target, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = good ? "#4ade80" : Math.abs(r - 0.3) < 0.2 ? "#facc15" : "#f87171"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, ring, 0, Math.PI * 2); ctx.stroke();
  }
  // the orb: flies in, then shakes on the ground
  let ox = cx, oy = cy + R * 0.55, rot = 0;
  if (c.phase === "throw") { const p = Math.min(1, (now - c.at) / 450); ox = cx; oy = H - 40 + (cy - H + 40) * p - Math.sin(p * Math.PI) * R * 1.5; rot = p * 8; }
  if (c.phase === "shake") { const k = (now - c.at) / CONFIG.shakeMs; rot = Math.sin(k * Math.PI * 2) * 0.35 * (k % 1 < 0.6 ? 1 : 0); }
  if (c.phase !== "aim" && c.phase !== "fled") {
    ctx.save(); ctx.translate(ox, oy); ctx.rotate(rot);
    const o = R * 0.32;
    ctx.fillStyle = "#2fd4d4"; ctx.beginPath(); ctx.arc(0, 0, o, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#f4f4f8"; ctx.beginPath(); ctx.arc(0, 0, o, 0, Math.PI); ctx.fill();
    ctx.fillStyle = "#1a1726"; ctx.fillRect(-o, -o * 0.1, o * 2, o * 0.2); ctx.beginPath(); ctx.arc(0, 0, o * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, o * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.font = "900 22px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.lineWidth = 5; ctx.strokeStyle = "#000a";
  const title = `Wild ${sp.name} · Lv ${c.w.lv}`;
  ctx.strokeText(title, cx, cy - R * 1.9); ctx.fillStyle = typeColor(sp.type, 70); ctx.fillText(title, cx, cy - R * 1.9);
  ctx.font = "800 16px system-ui, sans-serif"; ctx.strokeText(c.text, cx, cy + R * 1.9, W - 32); ctx.fillStyle = "#fff"; ctx.fillText(c.text, cx, cy + R * 1.9, W - 32);
  if (c.phase === "aim") { ctx.font = "700 13px system-ui, sans-serif"; ctx.fillStyle = "#ffffffaa"; ctx.fillText(`${CONFIG.catchTries - c.tries} throw${CONFIG.catchTries - c.tries === 1 ? "" : "s"} left · tap or press Space`, cx, cy + R * 1.9 + 24); }
  for (let i = sparks.length - 1; i >= 0; i--) { const p = sparks[i]; p.life -= 1 / 60; p.x += p.vx / 60; p.y += p.vy / 60; p.vy += 6; if (p.life <= 0) { sparks.splice(i, 1); continue; } ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.col; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); }
  ctx.globalAlpha = 1;
}
const sparks = [];
function burstScreen(n) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 280; sparks.push({ x: W / 2, y: H * 0.45, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, life: 0.9, col: ["#ffd166", "#ffffff", "#2fd4d4", "#ff8fb1"][i % 4] }); } }
let actx = null, lastSound = 0; // sounds start after the first tap (browsers require it)
function sound(freq, len, vol = 0.15) {
  const now = performance.now();
  if (!actx || ATTRACT || now - lastSound < 50) return;
  lastSound = now;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 1.4), t + len);
  g.gain.setValueAtTime(vol * 0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + len + 0.05);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + len + 0.08);
}

// ── HUD & INPUT ─────────────────────────────────────────────────────────────────────
let dropped = false, toastUntil = 0;
function toast(text) { $("toast").textContent = text; $("toast").style.opacity = 1; toastUntil = performance.now() + 2200; }
function hud(now) {
  const b = battle(), mine = busyBattle(b) && mySideOf(b) >= 0, foe = opponent(), foeBusy = foe && foe !== "bot" && (inBattle(foe) || holding(foe));
  $("bpanel").hidden = !mine || ATTRACT;
  $("fight").hidden = mine || ATTRACT || !!catching || !foe;
  if (foe) { $("fight").textContent = foeBusy ? `${nameOf(foe)} is busy` : `Battle ${nameOf(foe)}`; $("fight").disabled = foeBusy || !battleTeam().length || busyBattle(b); }
  $("hint").style.opacity = !hintOff && !mine && !ATTRACT && now < 25000 ? 1 : 0;
  if (now > toastUntil) $("toast").style.opacity = 0;
  const n = livePlayers().length;
  $("net").textContent = ATTRACT ? "" : net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the field" : ""}`;
}
$("fight").onclick = () => { challenge(opponent()); hintOff = true; };
const keys = new Set(), stick = { id: null, x: 0, y: 0, t: 0, moved: false };
function readKeys() {
  if (stick.id !== null) return;
  input.x = (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0);
  input.y = (keys.has("s") || keys.has("arrowdown") ? 1 : 0) - (keys.has("w") || keys.has("arrowup") ? 1 : 0);
  if (input.x || input.y) me.goal = null;
}
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase(); keys.add(k);
  if (k === " " || k.startsWith("arrow")) e.preventDefault();
  if (k === " " && catching) throwOrb(performance.now());
  const b = battle(), i = "123".indexOf(k);
  if (i >= 0 && busyBattle(b) && mySideOf(b) >= 0) pickMove(i);

addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
// Pointer: during catching any tap throws. On the field, a tap walks there and a drag is a thumb stick.
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (!actx) try { actx = new AudioContext(); } catch {}
  if (catching) { throwOrb(performance.now()); return; }
  if (busyBattle(battle()) && mySideOf(battle()) >= 0) return;
  const slot = teamSlots.find((s) => e.clientX >= s.x && e.clientX <= s.x + s.w && e.clientY >= s.y && e.clientY <= s.y + s.h);
  if (slot) { const [c] = save.team.splice(slot.i, 1); save.team.unshift(c); writeSave(); const sp = species(c.s), st = stats(c); toast(`${sp.name} · ${CONFIG.types[sp.type].name} · Lv ${c.lv} · ${st.hp} HP · leads your team`); return; }

  cv.setPointerCapture(e.pointerId);

cv.addEventListener("pointermove", (e) => {
  if (e.pointerId !== stick.id) return;
  const dx = e.clientX - stick.x, dy = e.clientY - stick.y, d = Math.hypot(dx, dy);
  if (d > 12) stick.moved = true;
  if (stick.moved) { input.x = dx / Math.max(d, 44); input.y = dy / Math.max(d, 44); me.goal = null; }
});
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => {
  if (e.pointerId !== stick.id) return;
  if (!stick.moved && ev === "pointerup") me.goal = toWorld(e.clientX, e.clientY); // a tap: walk there
  stick.id = null; input.x = input.y = 0;
});
function drawStick() { if (stick.id === null || !stick.moved) return; ctx.strokeStyle = "#ffffff66"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(stick.x, stick.y, 44, 0, Math.PI * 2); ctx.stroke(); ctx.fillStyle = "#ffffff55"; ctx.beginPath(); ctx.arc(stick.x + input.x * 44, stick.y + input.y * 44, 18, 0, Math.PI * 2); ctx.fill(); }
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
try { myName = localStorage.getItem("mpa-name") || ""; } catch {}
const pickOne = (list) => list[Math.floor(Math.random() * list.length)];
if (!myName) { myName = pickOne(NAME_A) + " " + pickOne(NAME_B); try { localStorage.setItem("mpa-name", myName); } catch {} }
if (ATTRACT) Object.assign(CONFIG, { stepMs: 620, resultMs: 1500, turnMs: 4000, shakeMs: 300, caughtMs: 800 });
/** Two players picked the same color at once (the room can look empty as you join): the later sessionId picks again. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  if (!others.some(([id, p]) => id < net.sessionId && p.c === myColor) && myColor !== RIVAL_COLOR) return;
  const used = new Set(others.map(([, p]) => p.c)), free = COLORS.find((c) => !used.has(c));
  if (free && free !== myColor) { myColor = free; net.me.set("c", myColor); }
}
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  readKeys();
  if (isHost()) hostTick(dt, now); else { host.wasHost = false; host.last = null; }

  catchTick(now);
  myTick(dt, now);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (mine || (b && bv.id === b.id && mySideOf(b) >= 0 && (bv.cur || bv.queue.length))) {

    viewTick(b, now); drawBattle(b, now, dt); drawMoves(b);
    if (b.phase !== "pick" && !bv.cur && !bv.queue.length) battleOver(b);
  } else { drawField(now, dt); if (catching) drawCatch(now); }

}

(async function start() {
  paintField();
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("grab", (d, from) => { if (isHost()) applyGrab(from, d); });
  net.on("caught", (d, from) => { if (isHost()) applyCaught(from, d); });
  net.on("challenge", (d, from) => { if (isHost()) applyChallenge(from, d); });
  net.on("move", (d, from) => { if (isHost()) applyMove(from, d); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") { player = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }); board = player.leaderboard(CONFIG.board); }
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || pickOne(COLORS);
  me.x += (Math.random() - 0.5) * T * 5; // don't stand exactly on another tamer
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  publishPos(true);
  if (!ATTRACT) save = readLocal() || save;
  if (!save.team.length) save.team.push({ s: newSeed(ATTRACT ? "leaf" : pickOne(["ember", "tide", "leaf"])), lv: ATTRACT ? 6 : 5, xp: 0 }); // everyone starts with one critter
  writeSave();
  if (!ATTRACT) loadCloud();
  requestAnimationFrame(frame);
})();
</script>
